<style>

:root{
  --primary-red:#ff003c;
  --primary-dark:#8b0000;
  --accent-cyan:#00e5ff;
  --accent-purple:#bd00ff;
  --bg-dark:#060608;
  --bg-card:#0e0e12;
  --bg-sidebar:#08080c;
  --border-color:#1a1a24;
  --text-primary:#fff;
  --text-secondary:#9090a0;
  --gradient-main:linear-gradient(135deg,#8b0000 0%,#ff003c 50%,#bd00ff 100%);
  --gradient-accent:linear-gradient(135deg,#00e5ff 0%,#bd00ff 100%);
  --gradient-card:linear-gradient(145deg,rgba(139,0,0,.12) 0%,rgba(0,229,255,.04) 100%);
  --shadow-glow:0 0 30px rgba(255,0,60,.3);
  --shadow-cyan:0 0 30px rgba(0,229,255,.25);
  --transition:all .3s cubic-bezier(.4,0,.2,1);
  --sidebar-w:72px;
  --sidebar-expanded:260px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Poppins',sans-serif;
  background:var(--bg-dark);
  color:var(--text-primary);
  min-height:100vh;
  overflow-x:hidden;
}

/* ═══ ANIMATED MESH GRADIENT BACKGROUND ═══ */
.animated-bg{
  position:fixed;inset:0;z-index:-2;
  background:#060608;
}
.animated-bg::before{
  content:'';position:absolute;inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,0,60,.15) 0%,transparent 40%),
    radial-gradient(circle at 85% 80%,rgba(0,229,255,.12) 0%,transparent 40%),
    radial-gradient(circle at 50% 50%,rgba(189,0,255,.08) 0%,transparent 50%);
  animation:meshShift 20s ease-in-out infinite alternate;
}
@keyframes meshShift{
  0%{background-position:0% 0%,100% 100%,50% 50%}
  50%{background-position:30% 70%,70% 30%,60% 40%}
  100%{background-position:100% 100%,0% 0%,40% 60%}
}
.animated-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 0%,rgba(6,6,8,.4) 100%);
  pointer-events:none;
}

/* ═══ FLOATING ORB DECORATIONS ═══ */
.orb{
  position:fixed;border-radius:50%;filter:blur(80px);z-index:-1;pointer-events:none;
  opacity:.5;
}
