<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FearLauncher Network</title>
<style>
  :root { --accent:#2F8FFF; --bg:#05060a; --card:#0d1018; --border:#1c2333; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:#fff; min-height:100vh; }
  .wrap { max-width:420px; margin:0 auto; padding:32px 20px; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:#8892a6; font-size:13px; margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:16px; }
  input, select { width:100%; padding:12px; margin-bottom:12px; border-radius:8px; border:1px solid var(--border); background:#0a0d14; color:#fff; font-size:14px; }
  button { width:100%; padding:12px; border-radius:8px; border:none; background:var(--accent); color:#000; font-weight:700; font-size:14px; cursor:pointer; }
  button.secondary { background:transparent; border:1px solid var(--border); color:#fff; margin-top:8px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { background:#0a0d14; border:1px solid var(--border); color:#8892a6; font-weight:600; }
  .tabs button.active { background:var(--accent); color:#000; border-color:var(--accent); }
  .msg { font-size:13px; margin-top:10px; padding:10px; border-radius:8px; display:none; }
  .msg.error { background:#3a0d0d; color:#ff8080; display:block; }
  .msg.ok { background:#0d3a1a; color:#7fffa0; display:block; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:14px; }
  .row span:first-child { color:#8892a6; }
  #skinPreview { width:96px; height:96px; image-rendering:pixelated; border-radius:8px; border:1px solid var(--border); background:#0a0d14; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>FearLauncher Network</h1>
  <div class="sub">Login, skins, and cosmetics for your launcher account.</div>

  <div id="authView">
    <div class="tabs">
      <button id="tabLogin" class="active">Login</button>
      <button id="tabRegister">Register</button>
    </div>

    <div class="card" id="loginCard">
      <input id="loginUsername" placeholder="Username" autocomplete="username" />
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginBtn">Log In</button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <div class="card hidden" id="registerCard">
      <input id="regUsername" placeholder="Username (3-16 chars, letters/numbers/_)" />
      <input id="regPassword" type="password" placeholder="Password (min 6 chars)" />
      <button id="registerBtn">Create Account</button>
      <div class="msg" id="registerMsg"></div>
    </div>
  </div>

  <div id="dashView" class="hidden">
    <div class="card">
      <div class="row"><span>Username</span><span id="dashUsername">-</span></div>
      <div class="row"><span>UUID</span><span id="dashUuid" style="font-size:11px;">-</span></div>
      <div class="row"><span>Coins</span><span id="dashCoins">-</span></div>
      <button class="secondary" id="logoutBtn">Log Out</button>
    </div>

    <div class="card">
      <div style="margin-bottom:12px; font-weight:700;">Your Skin</div>
      <img id="skinPreview" src="" alt="No skin set" />
      <select id="skinModel">
        <option value="classic">Classic (Steve)</option>
        <option value="slim">Slim (Alex)</option>
      </select>
      <input type="file" id="skinFile" accept="image/png" />
      <button id="uploadSkinBtn">Upload Skin</button>
      <button class="secondary" id="removeSkinBtn">Remove Skin</button>
      <div class="msg" id="skinMsg"></div>
    </div>
  </div>
</div>

<script>
const API = ""; // same origin

function showMsg(el, text, ok) {
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "error");
}

function getToken() { return localStorage.getItem("token"); }
function setToken(t) { localStorage.setItem("token", t); }
function clearToken() { localStorage.removeItem("token"); }

document.getElementById("tabLogin").onclick = () => {
  document.getElementById("tabLogin").classList.add("active");
  document.getElementById("tabRegister").classList.remove("active");
  document.getElementById("loginCard").classList.remove("hidden");
  document.getElementById("registerCard").classList.add("hidden");
};
document.getElementById("tabRegister").onclick = () => {
  document.getElementById("tabRegister").classList.add("active");
  document.getElementById("tabLogin").classList.remove("active");
  document.getElementById("registerCard").classList.remove("hidden");
  document.getElementById("loginCard").classList.add("hidden");
};

document.getElementById("registerBtn").onclick = async () => {
  const username = document.getElementById("regUsername").value.trim();
  const password = document.getElementById("regPassword").value;
  const msg = document.getElementById("registerMsg");
  try {
    const r = await fetch(API + "/register", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await r.json();
    if (!r.ok) return showMsg(msg, data.error || "Registration failed.", false);
    setToken(data.token);
    showMsg(msg, "Account created!", true);
    loadDashboard();
  } catch (e) { showMsg(msg, "Network error.", false); }
};

document.getElementById("loginBtn").onclick = async () => {
  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;
  const msg = document.getElementById("loginMsg");
  try {
    const r = await fetch(API + "/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await r.json();
    if (!r.ok) return showMsg(msg, data.error || "Login failed.", false);
    setToken(data.token);
    loadDashboard();
  } catch (e) { showMsg(msg, "Network error.", false); }
};

document.getElementById("logoutBtn").onclick = () => {
  clearToken();
  document.getElementById("dashView").classList.add("hidden");
  document.getElementById("authView").classList.remove("hidden");
};

document.getElementById("uploadSkinBtn").onclick = async () => {
  const fileInput = document.getElementById("skinFile");
  const model = document.getElementById("skinModel").value;
  const msg = document.getElementById("skinMsg");
  if (!fileInput.files[0]) return showMsg(msg, "Pick a PNG file first.", false);

  const formData = new FormData();
  formData.append("skin", fileInput.files[0]);
  formData.append("model", model);

  try {
    const r = await fetch(API + "/api/skin", {
      method: "POST",
      headers: { Authorization: "Bearer " + getToken() },
      body: formData,
    });
    const data = await r.json();
    if (!r.ok) return showMsg(msg, data.error || "Upload failed.", false);
    showMsg(msg, "Skin updated! It may take a minute to show up in-game.", true);
    loadDashboard();
  } catch (e) { showMsg(msg, "Network error.", false); }
};

document.getElementById("removeSkinBtn").onclick = async () => {
  const msg = document.getElementById("skinMsg");
  try {
    const r = await fetch(API + "/api/skin", { method: "DELETE", headers: { Authorization: "Bearer " + getToken() } });
    const data = await r.json();
    if (!r.ok) return showMsg(msg, data.error || "Failed.", false);
    showMsg(msg, "Skin removed.", true);
    loadDashboard();
  } catch (e) { showMsg(msg, "Network error.", false); }
};

async function loadDashboard() {
  const token = getToken();
  if (!token) return;
  const r = await fetch(API + "/api/coins", { headers: { Authorization: "Bearer " + token } });
  if (!r.ok) { clearToken(); return; }

  document.getElementById("authView").classList.add("hidden");
  document.getElementById("dashView").classList.remove("hidden");

  const coinsData = await r.json();
  document.getElementById("dashCoins").textContent = coinsData.coins;

  // Decode username/uuid from token payload isn't safe client-side trust-wise for display only, so re-fetch via /login isn't ideal;
  // simplest: store last known user info at login/register time.
  const cached = JSON.parse(localStorage.getItem("userInfo") || "{}");
  document.getElementById("dashUsername").textContent = cached.username || "-";
  document.getElementById("dashUuid").textContent = cached.uuid || "-";
  document.getElementById("skinPreview").src = cached.uuid ? (API + "/skins/" + cached.uuid + ".png") : "";
}

// Cache user info whenever login/register succeeds
const origSetToken = setToken;
setToken = function (t) { origSetToken(t); };

// Patch: store user info returned from login/register
["loginBtn", "registerBtn"].forEach((id) => {
  const btn = document.getElementById(id);
  const original = btn.onclick;
  btn.onclick = async () => {
    await original();
  };
});

// Simpler: intercept fetch responses for /login and /register to cache user info
(function patchFetchForUserInfo() {
  const origFetch = window.fetch;
  window.fetch = async function (...args) {
    const res = await origFetch(...args);
    const url = args[0];
    if ((url === API + "/login" || url === API + "/register") && res.ok) {
      const clone = res.clone();
      clone.json().then((data) => {
        if (data.user) localStorage.setItem("userInfo", JSON.stringify(data.user));
      }).catch(() => {});
    }
    return res;
  };
})();

if (getToken()) loadDashboard();
</script>
</body>
</html>
