<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CraftynMC - Epic Gaming Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/skinview3d@3.0.1/bundles/skinview3d.bundle.js"></script>
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5949915414960033"
     crossorigin="anonymous"></script>
<style>

:root{
  --primary-red:#ff003c;
  --primary-dark:#8b0000;
  --accent-cyan:#00e5ff;
  --accent-purple:#bd00ff;
  --bg-dark:#060608;
  --bg-card:#0e0e12;
  --bg-sidebar:#08080c;
  --border-color:#1a1a24;
  --text-primary:#fff;
  --text-secondary:#9090a0;
  --gradient-main:linear-gradient(135deg,#8b0000 0%,#ff003c 50%,#bd00ff 100%);
  --gradient-accent:linear-gradient(135deg,#00e5ff 0%,#bd00ff 100%);
  --gradient-card:linear-gradient(145deg,rgba(139,0,0,.12) 0%,rgba(0,229,255,.04) 100%);
  --shadow-glow:0 0 30px rgba(255,0,60,.3);
  --shadow-cyan:0 0 30px rgba(0,229,255,.25);
  --transition:all .3s cubic-bezier(.4,0,.2,1);
  --sidebar-w:72px;
  --sidebar-expanded:260px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Poppins',sans-serif;
  background:var(--bg-dark);
  color:var(--text-primary);
  min-height:100vh;
  overflow-x:hidden;
}

/* ═══ ANIMATED MESH GRADIENT BACKGROUND ═══ */
.animated-bg{
  position:fixed;inset:0;z-index:-2;
  background:#060608;
}
.animated-bg::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,0,60,.15) 0%,transparent 40%),
    radial-gradient(circle at 85% 80%,rgba(0,229,255,.12) 0%,transparent 40%),
    radial-gradient(circle at 50% 50%,rgba(189,0,255,.08) 0%,transparent 50%);
  animation:meshShift 20s ease-in-out infinite alternate;
}
@keyframes meshShift{
  0%{background-position:0% 0%,100% 100%,50% 50%}
  50%{background-position:30% 70%,70% 30%,60% 40%}
  100%{background-position:100% 100%,0% 0%,40% 60%}
}
.animated-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 0%,rgba(6,6,8,.4) 100%);
  pointer-events:none;
}

/* ═══ FLOATING ORB DECORATIONS ═══ */
.orb{
  position:fixed;border-radius:50%;filter:blur(80px);z-index:-1;pointer-events:none;
  opacity:.5;
}
.orb-1{width:400px;height:400px;background:rgba(255,0,60,.15);top:-100px;left:-100px;animation:orbFloat1 18s ease-in-out infinite}
.orb-2{width:350px;height:350px;background:rgba(0,229,255,.1);bottom:-80px;right:-80px;animation:orbFloat2 22s ease-in-out infinite}
.orb-3{width:300px;height:300px;background:rgba(189,0,255,.08);top:40%;left:50%;animation:orbFloat3 25s ease-in-out infinite}
@keyframes orbFloat1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(100px,80px) scale(1.2)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-80px,-100px) scale(.9)}}
@keyframes orbFloat3{0%,100%{transform:translate(-50%,0) scale(1)}50%{transform:translate(-50%,-60px) scale(1.15)}}

/* ═══ PARTICLES ═══ */
.particles{position:fixed;inset:0;z-index:-1;pointer-events:none}
.particle{
  position:absolute;width:4px;height:4px;
  background:var(--primary-red);
  border-radius:50%;opacity:.3;
  animation:float 20s infinite;
  box-shadow:0 0 6px var(--primary-red);
}
@keyframes float{
  0%,100%{transform:translateY(100vh);opacity:0}
  10%,90%{opacity:.4}
  100%{transform:translateY(-100vh);opacity:0}
}

/* ═══ APP LAYOUT ═══ */
.app-container{display:flex;min-height:100vh}

/* ═══ SLIDE-TYPE SIDEBAR ═══ */
.sidebar{
  width:var(--sidebar-w);
  background:var(--bg-sidebar);
  border-right:1px solid var(--border-color);
  padding:20px 0;
  position:fixed;
  height:100vh;
  overflow-y:auto;
  overflow-x:hidden;
  z-index:100;
  transition:width .4s cubic-bezier(.34,1.56,.64,1);
}
.sidebar::-webkit-scrollbar{width:0}
.sidebar:hover{
  width:var(--sidebar-expanded);
  box-shadow:4px 0 40px rgba(0,0,0,.5);
}

.sidebar-header{
  padding:0 22px 24px;
  border-bottom:1px solid var(--border-color);
  margin-bottom:20px;
  white-space:nowrap;
  overflow:hidden;
}
.logo{
  display:flex;align-items:center;gap:14px;
  font-size:22px;font-weight:800;
  background:var(--gradient-main);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  opacity:0;transform:translateX(-20px);
  transition:opacity .3s ease .15s,transform .3s ease .15s;
}
.sidebar:hover .logo{opacity:1;transform:translateX(0)}
.logo i{font-size:28px;-webkit-text-fill-color:var(--primary-red);flex-shrink:0}
.logo span{opacity:0;transition:opacity .2s}
.sidebar:hover .logo span{opacity:1;transition:opacity .2s .2s}

/* Nav sections */
.nav-section{margin-bottom:18px;overflow:hidden}
.nav-title{
  font-size:11px;text-transform:uppercase;letter-spacing:1.5px;
  color:var(--text-secondary);padding:0 24px;margin-bottom:10px;font-weight:600;
  opacity:0;transition:opacity .2s;
}
.sidebar:hover .nav-title{opacity:1;transition:opacity .2s .1s}

.nav-item{
  display:flex;align-items:center;gap:14px;
  padding:12px 24px;
  color:var(--text-secondary);
  text-decoration:none;cursor:pointer;
  border-left:3px solid transparent;
  transition:var(--transition);
  font-size:14px;
  white-space:nowrap;
  position:relative;
  overflow:hidden;
}
.nav-item i{
  width:20px;text-align:center;flex-shrink:0;
  transition:transform .3s ease;
}
.nav-item span{
  opacity:0;
  transform:translateX(-10px);
  transition:opacity .2s,transform .2s;
}
.sidebar:hover .nav-item span{
  opacity:1;transform:translateX(0);
  transition:opacity .2s .15s,transform .2s .15s;
}

.nav-item:hover{
  background:linear-gradient(90deg,rgba(255,0,60,.12) 0%,transparent 100%);
  color:#fff;
  border-left-color:var(--primary-red);
}
.nav-item:hover i{transform:scale(1.3) rotate(-5deg)}
.nav-item.active{
  background:linear-gradient(90deg,rgba(255,0,60,.15) 0%,rgba(189,0,255,.05) 100%);
  color:#fff;
  border-left-color:var(--primary-red);
}
.nav-item.active i{color:var(--primary-red)}
.nav-item.active::after{
  content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:3px;height:60%;background:var(--gradient-main);border-radius:4px;
}

/* Logout button area */
.sidebar .full-width{
  white-space:nowrap;overflow:hidden;
}
.sidebar .full-width i{flex-shrink:0}

/* Mobile sidebar toggle */
.sidebar-toggle{
  display:none;
  position:fixed;top:16px;left:16px;z-index:200;
  width:44px;height:44px;border-radius:12px;
  background:var(--bg-card);border:1px solid var(--border-color);
  color:#fff;font-size:20px;cursor:pointer;
  align-items:center;justify-content:center;
  transition:var(--transition);
}
.sidebar-toggle:hover{border-color:var(--primary-red);box-shadow:var(--shadow-glow)}

/* ═══ MAIN CONTENT ═══ */
.main-content{
  flex:1;
  margin-left:var(--sidebar-w);
  padding:32px;
  min-height:100vh;
  transition:margin-left .4s cubic-bezier(.34,1.56,.64,1);
}
.sidebar:hover ~ .main-content{
  margin-left:var(--sidebar-expanded);
}

/* ═══ TOP BAR ═══ */
.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:32px;padding:20px 24px;
  background:rgba(14,14,18,.7);
  backdrop-filter:blur(12px);
  border-radius:16px;
  border:1px solid var(--border-color);
  box-shadow:0 4px 20px rgba(0,0,0,.3);
  animation:slideDown .6s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slideDown{
  from{opacity:0;transform:translateY(-20px)}
  to{opacity:1;transform:translateY(0)}
}

.user-info{display:flex;align-items:center;gap:16px}
.avatar{
  width:48px;height:48px;border-radius:12px;
  background:var(--gradient-main);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;overflow:hidden;
  background-size:cover;background-position:center;
  transition:var(--transition);
  position:relative;
}
.avatar::after{
  content:'';position:absolute;inset:0;border-radius:12px;
  background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.2) 50%,transparent 60%);
  background-size:200% 200%;
  animation:shimmer 3s ease-in-out infinite;
}
@keyframes shimmer{
  0%,100%{background-position:200% 0}
  50%{background-position:-100% 0}
}
.user-details h3{font-size:16px;font-weight:600}
.user-details p{font-size:13px;color:var(--text-secondary)}

.coin-display{
  display:flex;align-items:center;gap:8px;
  padding:10px 20px;
  background:rgba(255,215,0,.08);
  border:1px solid rgba(255,215,0,.3);
  border-radius:12px;
  transition:var(--transition);
}
.coin-display:hover{
  box-shadow:0 0 20px rgba(255,215,0,.2);
  transform:scale(1.05);
}
.coin-display i,.coin-display span{color:gold;font-weight:700}

/* ═══ CARDS ═══ */
.card{
  background:rgba(14,14,18,.6);
  backdrop-filter:blur(10px);
  border:1px solid var(--border-color);
  border-radius:16px;
  padding:24px;
  margin-bottom:24px;
  position:relative;
  overflow:hidden;
  transition:var(--transition);
  animation:cardReveal .5s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes cardReveal{
  from{opacity:0;transform:translateY(30px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 0%,rgba(255,0,60,.03) 50%,transparent 100%);
  opacity:0;transition:opacity .3s;
}
.card:hover{
  border-color:var(--primary-red);
  box-shadow:var(--shadow-glow);
  transform:translateY(-2px);
}
.card:hover::before{opacity:1}

.card-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;flex-wrap:wrap;gap:12px;
}
.card-title{
  font-size:18px;font-weight:700;
  display:flex;align-items:center;gap:10px;
}
.card-title i{color:var(--primary-red)}

/* ═══ GRIDS ═══ */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}

@media(max-width:1100px){.grid-4,.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .sidebar{
    transform:translateX(-100%);
    width:var(--sidebar-expanded);
  }
  .sidebar.mobile-open{
    transform:translateX(0);
    box-shadow:4px 0 40px rgba(0,0,0,.5);
  }
  .sidebar.mobile-open .logo,
  .sidebar.mobile-open .nav-title,
  .sidebar.mobile-open .nav-item span{
    opacity:1!important;transform:translateX(0)!important;
  }
  .main-content{margin-left:0!important}
  .sidebar-toggle{display:flex}
}

/* ═══ FEATURE CARDS ═══ */
.feature-card{
  background:var(--gradient-card);
  border:1px solid var(--border-color);
  border-radius:16px;padding:24px;text-align:center;
  cursor:pointer;transition:var(--transition);
  position:relative;overflow:hidden;
}
.feature-card::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,0,60,.1) 0%,transparent 50%);
  opacity:0;transition:opacity .3s;
}
.feature-card:hover{
  transform:translateY(-8px) scale(1.02);
  border-color:var(--primary-red);
  box-shadow:0 10px 30px rgba(255,0,60,.2);
}
.feature-card:hover::after{opacity:1}

.feature-icon{
  width:72px;height:72px;margin:0 auto 14px;
  background:rgba(255,0,60,.1);
  border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;color:var(--primary-red);
  transition:var(--transition);
}
.feature-card:hover .feature-icon{
  transform:rotateY(180deg);
  background:rgba(0,229,255,.1);
  color:var(--accent-cyan);
}

/* ═══ TIER BADGES ═══ */
.tier-badge{
  display:inline-block;padding:4px 12px;
  border-radius:20px;font-size:11px;font-weight:600;
  text-transform:uppercase;
}
.tier-free{background:rgba(0,255,136,.1);color:#00ff88;border:1px solid #00ff88}
.tier-premium{background:var(--gradient-main);color:#fff}

/* ═══ INPUTS ═══ */
input,select,textarea{
  width:100%;padding:14px 18px;margin-bottom:14px;
  border-radius:12px;
  border:1px solid var(--border-color);
  background:rgba(0,0,0,.3);
  color:#fff;font-size:14px;font-family:inherit;
  transition:var(--transition);
}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:var(--primary-red);
  box-shadow:0 0 15px rgba(255,0,60,.2);
  background:rgba(0,0,0,.5);
}

/* ═══ BUTTONS ═══ */
button{
  padding:14px 28px;border-radius:12px;border:none;
  background:var(--gradient-main);
  color:#fff;font-weight:600;font-size:14px;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
  transition:var(--transition);
  position:relative;overflow:hidden;
}
button::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.2) 0%,transparent 50%);
  opacity:0;transition:opacity .3s;
}
button:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-glow);
}
button:hover::before{opacity:1}
button:active{transform:translateY(0) scale(.98)}
button.secondary{background:transparent;border:1px solid var(--border-color)}
button.secondary:hover{border-color:var(--primary-red);box-shadow:0 0 15px rgba(255,0,60,.15)}
button.full-width{width:100%;justify-content:center}

/* ═══ MESSAGES ═══ */
.msg{
  padding:14px 18px;border-radius:12px;margin-top:12px;
  font-size:13px;display:none;
}
.msg.error{
  background:rgba(255,0,60,.1);color:#ff6b6b;
  border:1px solid #ff003c;display:block;
  animation:shake .4s ease;
}
.msg.ok{
  background:rgba(0,255,136,.1);color:#00ff88;
  border:1px solid #00ff88;display:block;
  animation:slideIn .4s ease;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}
@keyframes slideIn{
  from{opacity:0;transform:translateX(-10px)}
  to{opacity:1;transform:translateX(0)}
}

/* ═══ SECTIONS ═══ */
.section{display:none}
.section.active{
  display:block;
  animation:sectionEnter .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes sectionEnter{
  from{opacity:0;transform:translateY(20px) perspective(800px) rotateX(-5deg)}
  to{opacity:1;transform:translateY(0) perspective(800px) rotateX(0)}
}

/* ═══ STAT CARDS ═══ */
.stat-card{
  background:var(--gradient-card);
  border:1px solid var(--border-color);
  border-radius:16px;padding:24px;text-align:center;
  transition:var(--transition);
  position:relative;overflow:hidden;
}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--gradient-main);
  transform:scaleX(0);transform-origin:left;
  transition:transform .4s ease;
}
.stat-card:hover::before{transform:scaleX(1)}
.stat-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.stat-value{
  font-size:32px;font-weight:800;
  background:var(--gradient-main);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.stat-label{font-size:13px;color:var(--text-secondary);margin-top:8px}

/* ═══ SHOP ITEMS ═══ */
.shop-item{
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:16px;padding:20px;text-align:center;
  transition:var(--transition);
}
.shop-item:hover{
  border-color:var(--accent-cyan);
  box-shadow:var(--shadow-cyan);
  transform:translateY(-4px);
}
.shop-item-image{
  height:100px;display:flex;align-items:center;justify-content:center;
  font-size:40px;color:var(--primary-red);margin-bottom:12px;
  transition:var(--transition);
}
.shop-item:hover .shop-item-image{transform:scale(1.1) rotate(-5deg)}
.shop-item-price{font-size:18px;font-weight:700;color:gold;margin:10px 0}
